; ============================================================
; CulturesGameExtend - 非官方补丁配置（单独成文件）
; ============================================================
; 本文件包含所有"非官方内容"：补丁注入主开关 + 复杂 code cave 补丁。
; 与框架自身配置（CulturesGameExtend_Global/Game.ini）分离，
; 便于只保留官方/框架能力时直接停用本文件。

; ============================================================
; CulturesPatches - 补丁注入主开关
; ============================================================
[CulturesPatches]
; 是否启用补丁注入 Feature
Enabled = 1
; 纯字节补丁数据目录（相对游戏根目录）
PatchDir = plugins/config/patches
; code cave 起始偏移（相对 image base 0x400000）
CodeCaveStart = 0xf21cb

; ============================================================
; 复杂 code cave 补丁（各补丁独立开关）
; ============================================================
[AssistantCtrlClick]
; Shift+点击时助理请求量改为 ±10
Enabled = 1

[MultiplayerStability]
; 联机稳定性（纯字节部分见 patches/multiplayerStability.ini）
Enabled = 1
; 传输线程加入 Sleep 以降低 CPU（code cave）
ThreadSleep = 1

[MultiplayerVersionCheck]
; 联机版本号提示（99.2）
Enabled = 1
