# multiplayerTransferSize.ini
# 增大联机存档/自定义地图传输包大小 0x5000 (32 KB)
# 格式: <addr> <hex bytes>   (addr 相对 image base 0x400000)
# 增大栈并压入新大小
0xDFBD3 B8 68 51 00 00 | B8 68 11 00 00 ; MOV EAX, 0x5168
0xDFD87 68 00 50 00 00 | 68 00 08 00 00 ; PUSH 0x5000
# 移动消息写入参数
0xDFD8D 8D 85 B0 AE FF FF | 8D 85 98 EE FF FF ; LEA EAX, [EBP+0xFFFFAEB0]
0xDFDA6 C6 85 98 AE FF FF 0F | C6 85 98 F6 FF FF 0F ; MOV byte ptr [EBP+0xFFFFAE98], 0xF
0xDFDAF 8D BD 9C AE FF FF | 8D BD 9C F6 FF FF ; LEA EDI, [EBP+0xFFFFAE9C]
0xDFDC0 89 85 AC AE FF FF | 89 85 AC F6 FF FF ; MOV dword ptr [EBP+0xFFFFAEAC], EAX
# NOP 掉重复缓冲区 memcpy
0xDFDD4 90 90 90 90 90 | E8 77 5B 00 00
# 移动地址并更新发送消息大小
0xDFDDF 8D 85 98 AE FF FF | 8D 85 98 F6 FF FF ; LEA EAX, [EBP+0xFFFFAE98]
0xDCFDA C7 45 F8 18 50 00 00 | C7 45 F8 18 08 00 00 ; MOV dword ptr [EBP-0x8], 0x5018
