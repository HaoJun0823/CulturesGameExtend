# pathfinderLimits.ini
# 提高寻路上限 2000 -> 10000，并允许 22 路并发搜索（原 2）
# 格式: <addr> <hex bytes>   (addr 相对 image base 0x400000)
#
# PathfinderArray::Constructor()
# MOV EDI, 0x142440  (10000 * 0x84)
0x1cdaa BF 40 24 14 00 | BF 40 07 04 00
# MOV dword ptr [EBP-0x8], 0x2710  (10000)
0x1cdc1 C7 45 F8 10 27 00 00 | C7 45 F8 D0 07 00 00
# PUSH 0x2710
0x1ce09 68 10 27 00 00 | 68 D0 07 00 00
# GameControl::System_PathfinderLimit_IsSearchAllowed()
# CMP ECX, 0x16  (22 searches)
0x9d89 83 F9 16 | 83 F9 02
