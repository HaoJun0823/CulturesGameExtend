# mapMoveableLimits.ini
# 提高可移动单位总上限 2000 -> 10000
# 格式: <addr> <hex bytes>   (addr 相对 image base 0x400000)
#
# MapMoveableArray::Constructor()
# MOV EBX, 0xD6D80  (10000 * 0x58)
0xbb42 BB 80 6D 0D 00 | BB 80 AF 02 00
# MOV dword ptr [EBP-0x8], 0x2710  (10000)
0xbb5c C7 45 F8 10 27 00 00 | C7 45 F8 D0 07 00 00
# PUSH 0x2710
0xbb9e 68 10 27 00 00 | 68 D0 07 00 00
