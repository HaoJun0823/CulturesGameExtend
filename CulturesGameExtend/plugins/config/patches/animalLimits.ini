# animalLimits.ini
# 提高动物上限 500 -> 2500
# 格式: <addr> <hex bytes>   (addr 相对 image base 0x400000)
#
# AnimalArray::Constructor()
# MOV EBP, 0x5CC60  (2500 * 0x98)
0x1c0e0 BD 60 CC 05 00 | BD E0 28 01 00
# MOV dword ptr [ESP+0x14], 0x9C4  (2500)
0x1c0fb C7 44 24 14 C4 09 00 00 | C7 44 24 14 F4 01 00 00
# PUSH 0x9C4
0x1c144 68 C4 09 00 00 | 68 F4 01 00 00
