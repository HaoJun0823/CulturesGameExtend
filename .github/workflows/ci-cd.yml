name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE.txt'
      - '.gitattributes'
      - '.gitmodules'
    tags:
      - 'v*'                           # 推送 v0.4.0 等标签时自动发布
  pull_request:
    branches: [ main, master ]

env:
  BUILD_CONFIGURATION: Release
  BUILD_PLATFORM: Win32
  SOLUTION_DIR: .

jobs:
  # ──────────────────────────────────────────────
  # 构建作业
  # ──────────────────────────────────────────────
  build:
    runs-on: windows-2022

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0                   # 获取所有 tag 用于版本号注入

      - name: 添加 MSBuild 到 PATH
        uses: microsoft/setup-msbuild@v2
        # 注意：windows-2022 镜像没有 v141_xp 工具集
        # 项目默认使用 v141_xp (XP 兼容)，但 CI 使用 v142 (VS 2019) 构建
        # 如需 XP 兼容，请在本地用 VS 2017 编译

      - name: 设置工具集版本 (v142 = VS 2019)
        shell: pwsh
        run: |
          echo "TOOLSET=v142" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          # windows-2022 没有 SDK 8.1，使用最新 SDK
          echo "WINSDK=10.0" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "PlatformToolset: v142 (VS 2019, 预装于 windows-2022)"
          Write-Host "WindowsSDK: 10.0 (runner 默认)"
          Write-Host "注: 项目原生 v141_xp + SDK 8.1 (XP 兼容) 需本地 VS 2017 编译"

      - name: 从 Git 标签提取版本号
        shell: pwsh
        run: |
          # git describe 可能因无标签返回非零退出码，用 try/catch 处理
          $ver = "0.0.0"
          try {
            $tag = git describe --tags --abbrev=0 2>&1
            if ($tag -and ($tag -match '^v[\d.]+')) {
              $ver = $tag -replace '^v' -replace '-.*$'
            }
          } catch {
            # 无标签时使用默认版本
          }
          echo "CGE_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "注入版本: $ver"

      - name: 构建 CulturesGameExtend (Release)
        shell: pwsh
        run: |
          $ver = if ($env:CGE_VERSION) { $env:CGE_VERSION } else { "0.0.0" }
          msbuild CulturesGameExtend\CulturesGameExtend.vcxproj `
            /p:Configuration=${{ env.BUILD_CONFIGURATION }} `
            /p:Platform=${{ env.BUILD_PLATFORM }} `
            "/p:PlatformToolset=$env:TOOLSET" `
            "/p:WindowsTargetPlatformVersion=$env:WINSDK" `
            "/p:PreprocessorDefinitions=CGE_VERSION_STR=`"$ver`";%(PreprocessorDefinitions)" `
            /p:OutDir=${{ github.workspace }}\BuildOutput\ `
            /p:UseEnv=true `
            /m
          if ($LASTEXITCODE -ne 0) { throw "CulturesGameExtend 构建失败" }

      - name: 构建 CulturesProxyDLL (Release)
        shell: pwsh
        run: |
          msbuild CulturesProxyDLL\CulturesProxyDLL.vcxproj `
            /p:Configuration=${{ env.BUILD_CONFIGURATION }} `
            /p:Platform=${{ env.BUILD_PLATFORM }} `
            "/p:PlatformToolset=$env:TOOLSET" `
            "/p:WindowsTargetPlatformVersion=$env:WINSDK" `
            /p:OutDir=${{ github.workspace }}\BuildOutput\ `
            /p:UseEnv=true `
            /m
          if ($LASTEXITCODE -ne 0) { throw "CulturesProxyDLL 构建失败" }

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: CulturesGameExtend-${{ env.BUILD_CONFIGURATION }}
          path: |
            BuildOutput\*.dll
            BuildOutput\*.pdb
            BuildOutput\plugins\**\*
            BuildOutput\config\**\*
            BuildOutput\Data\**\*
          if-no-files-found: error

  # ──────────────────────────────────────────────
  # 发布作业（仅 tag 推送时触发）
  # ──────────────────────────────────────────────
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write                    # 允许创建 Release

    steps:
      - name: 检出代码（用于 Release Notes）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: CulturesGameExtend-${{ env.BUILD_CONFIGURATION }}
          path: artifacts

      - name: 打包为 ZIP
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $zipName = "CulturesGameExtend-${tag}.zip"
          Compress-Archive -Path artifacts\* -DestinationPath $zipName
          echo "Created: $zipName"
          echo "ZIP_NAME=$zipName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
          generate_release_notes: true
          body: |
            ## CulturesGameExtend ${{ github.ref_name }}

            📦 包含：
            - `CulturesGameExtend.dll` — 主增强插件
            - `dinput8.dll` — 代理载体 DLL
            - `plugins/` — 配置文件与资源

            > 部署：将 ZIP 解压到游戏目录 `SAGA_GAME_HACK/` 即可。
            > 详细更新见 [CHANGELOG.md](CHANGELOG.md)。