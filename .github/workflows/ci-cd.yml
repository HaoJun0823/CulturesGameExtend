name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE.txt'
      - '.gitattributes'
      - '.gitmodules'
    tags:
      - 'v*'                           # 推送 v0.4.0 等标签时自动发布
  pull_request:
    branches: [ main, master ]

env:
  BUILD_CONFIGURATION: Release
  BUILD_PLATFORM: Win32
  SOLUTION_DIR: .

jobs:
  # ──────────────────────────────────────────────
  # 构建作业
  # ──────────────────────────────────────────────
  build:
    runs-on: windows-2022

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0                   # 获取所有 tag 用于版本号注入

      - name: 添加 MSBuild 到 PATH
        uses: microsoft/setup-msbuild@v2

      - name: 安装 v141_xp 工具集
        shell: pwsh
        run: |
          # 检查 v141_xp 是否已安装
          $testPath = "C:\Program Files (x86)\Microsoft Visual Studio\2019\BuildTools\MSBuild\Microsoft\vc\v141"
          if (Test-Path "$testPath") {
            Write-Host "v141_xp 工具集已存在，跳过安装"
          } else {
            Write-Host "正在安装 v141_xp 工具集..."
            $vsWhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
            $vsPath = & $vsWhere -latest -property installationPath
            $setupExe = "$vsPath\Installer\setup.exe"
            # 安装 Windows XP 支持 for C++ 组件
            & $setupExe modify --installPath "$vsPath" `
              --add Microsoft.VisualStudio.Component.VC.v141.xp `
              --quiet --norestart --wait
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::warning::v141_xp 安装失败，将使用 v142 作为回退工具集"
              echo "USE_FALLBACK_TOOLSET=true" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            } else {
              Write-Host "v141_xp 工具集安装完成"
            }
          }
      
      - name: 设置工具集版本环境变量
        shell: pwsh
        run: |
          if ("$env:USE_FALLBACK_TOOLSET" -eq "true") {
            echo "TOOLSET=v142" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } else {
            echo "TOOLSET=v141_xp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: 从 Git 标签提取版本号
        shell: pwsh
        run: |
          $ver = git describe --tags --abbrev=0 2>$null
          if (-not $ver) { $ver = "0.0.0" }
          $ver = $ver -replace '^v' -replace '-.*$'
          echo "CGE_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "注入版本: $ver"

      - name: 构建 CulturesGameExtend (Release)
        shell: pwsh
        run: |
          $toolset = if ($env:TOOLSET) { $env:TOOLSET } else { "v141_xp" }
          Write-Host "Using PlatformToolset: $toolset"
          msbuild CulturesGameExtend\CulturesGameExtend.vcxproj `
            /p:Configuration=${{ env.BUILD_CONFIGURATION }} `
            /p:Platform=${{ env.BUILD_PLATFORM }} `
            "/p:PlatformToolset=$toolset" `
            /p:OutDir=${{ github.workspace }}\BuildOutput\ `
            /p:UseEnv=true `
            /m
          if ($LASTEXITCODE -ne 0) { throw "Build failed" }

      - name: 构建 CulturesProxyDLL (Release)
        shell: pwsh
        run: |
          $toolset = if ($env:TOOLSET) { $env:TOOLSET } else { "v141_xp" }
          Write-Host "Using PlatformToolset: $toolset"
          msbuild CulturesProxyDLL\CulturesProxyDLL.vcxproj `
            /p:Configuration=${{ env.BUILD_CONFIGURATION }} `
            /p:Platform=${{ env.BUILD_PLATFORM }} `
            "/p:PlatformToolset=$toolset" `
            /p:OutDir=${{ github.workspace }}\BuildOutput\ `
            /p:UseEnv=true `
            /m
          if ($LASTEXITCODE -ne 0) { throw "Build failed" }

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: CulturesGameExtend-${{ env.BUILD_CONFIGURATION }}
          path: |
            BuildOutput\*.dll
            BuildOutput\*.pdb
            BuildOutput\plugins\**\*
            BuildOutput\config\**\*
            BuildOutput\Data\**\*
          if-no-files-found: error

  # ──────────────────────────────────────────────
  # 发布作业（仅 tag 推送时触发）
  # ──────────────────────────────────────────────
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write                    # 允许创建 Release

    steps:
      - name: 检出代码（用于 Release Notes）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: CulturesGameExtend-${{ env.BUILD_CONFIGURATION }}
          path: artifacts

      - name: 打包为 ZIP
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $zipName = "CulturesGameExtend-${tag}.zip"
          Compress-Archive -Path artifacts\* -DestinationPath $zipName
          echo "Created: $zipName"
          echo "ZIP_NAME=$zipName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
          generate_release_notes: true
          body: |
            ## CulturesGameExtend ${{ github.ref_name }}

            📦 包含：
            - `CulturesGameExtend.dll` — 主增强插件
            - `dinput8.dll` — 代理载体 DLL
            - `plugins/` — 配置文件与资源

            > 部署：将 ZIP 解压到游戏目录 `SAGA_GAME_HACK/` 即可。
            > 详细更新见 [CHANGELOG.md](CHANGELOG.md)。