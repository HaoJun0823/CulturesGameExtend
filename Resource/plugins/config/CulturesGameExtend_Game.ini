; CulturesGameExtend - Game 配置（覆盖 Global）
; 本文件用于按游戏覆盖配置，供后续功能使用。
; 日志级别由 CulturesGameExtend_Global.ini 统一控制，不在此处覆盖。
; CulturesGameExtend - Game config (overrides Global)
; This file overrides per-game settings and is consumed by the features.
; Log level is controlled centrally by CulturesGameExtend_Global.ini and is not overridden here.
; ============================================================
; ============================================================

; UserCampaigns - 文件夹形式自定义战役地图
; 允许 UserCampaign 目录以"文件夹形式"加载地图（等价 *.c2m 打包文件）。
; UserCampaigns - folder-style custom campaign maps
; Allows loading maps from a UserCampaign folder (equivalent to a *.c2m package).
; ============================================================
; ============================================================
[UserCampaigns]
; 是否启用本 Feature
; Whether to enable this feature
Enabled = 1
; AllowCurrentUserMapFolder=1 时，额外扫描 <地图文件夹>\currentusermap\map.ini
; （c2m 解包布局，如 Campaign00\01_Ein_neuer_Anfang\currentusermap\map.ini）。
; 默认(0)只扫目录根 map.ini（官方 data\maps\<dir> 布局）。
; When AllowCurrentUserMapFolder=1, also scan <map folder>/currentusermap/map.ini
; (c2m extraction layout, e.g. Campaign00/01_Ein_neuer_Anfang/currentusermap/map.ini)
; Default (0) scans only the directory-root map.ini (official data/maps/<dir> layout).
AllowCurrentUserMapFolder = 1
; 可选：额外战役目录（相对 datax\usercampaigns\），name=战役ID;name=战役ID
; 注意：战役 ID 必须 < 9（campaign00/01 占 7/8）；9+ 需另行 patch。
; Optional: extra campaign directories (relative to datax/usercampaigns/), name=campaignID;name=campaignID
; Note: campaign ID must be < 9 (campaign00/01 occupy 7/8); 9+ needs a separate patch.
; CampaignDirs = campaign02=9;campaign03=10
; CampaignDirs = campaign02=9;campaign03=10   (example: extra campaign directory mapping)

; Cultures2Campaign - 文化II：阿斯加德之门（入口按钮 + 战役屏加载）
; 合并原 AsgardCampaign（主菜单入口按钮）与 Cultures2Campaign（战役屏加载）两半为一个开关。
; 按钮文本：Data\text\l10\strings\saga\saga001.ini ID 25/26
; bmd 前置：Data\gui\lang\ger\bobs\ls_menu_logos.bmd 须为 35 帧版。
; Cultures2Campaign - Cultures II: Gates of Asgard (entry button + campaign screen loading)
; Merges the former AsgardCampaign (main-menu entry button) and Cultures2Campaign (campaign screen loading) into one switch.
; Button text: Data/text/l10/strings/saga/saga001.ini IDs 25/26
; Prereq bmd: Data/gui/lang/ger/bobs/ls_menu_logos.bmd must be the 35-frame version.
; ============================================================
; ============================================================
[Cultures2Campaign]
; 是否启用本 Feature（同时控制入口按钮与战役屏加载）
; Whether to enable this feature (controls both the entry button and the campaign-screen loading)
Enabled = 1
; 是否插入主菜单入口按钮（0=仅加载战役屏，不插入按钮）
; Whether to insert the main-menu entry button (0 = load campaign screen only, no button)
AddButton = 1

; UnlockAllCampaigns - 无视 campaign.ini 进度，解锁全部战役 / 关卡
; hook sub_416E20(IsUnlocked) 恒返回 1。该判定只决定"关卡可否游玩"，
; 不影响通关 / 完成记录，因此全解锁不会破坏进度完整性。
; 默认关闭；需要"全解锁"体验时改为 1（无需重新编译）。
; UnlockAllCampaigns - ignore campaign.ini progress, unlock all campaigns / levels
; Hooks sub_416E20 (IsUnlocked) to always return 1. This only decides 'whether a level is playable',
; not affecting clear/completion records, so full unlock does not corrupt progress integrity.
; Disabled by default; set to 1 for a fully-unlocked experience (no recompile needed).
; ============================================================
; ============================================================
[UnlockAllCampaigns]
; 是否启用本 Feature
; Whether to enable this feature
Enabled = 0

; CampaignMovie - 文化II（campaign 1）开场电影 intro00.mpg
; 原版 sub_40306E 只硬编码 intro01/02/03（北国/第八/saga），
; 缺文化II 分支。本 Feature 在 0x403184 收敛点补上
; campaign 1 + node 10 -> "intro00"，进入首关前播放。
; 结尾电影 seq_0000 由数据层（电影 ID=0）解决，无需代码补丁。
; CampaignMovie - Cultures II (campaign 1) intro movie intro00.mpg
; Original sub_40306E only hard-codes intro01/02/03 (Northland/8th/saga),
; lacking a Cultures II branch. This feature patches the convergence point at 0x403184
; campaign 1 + node 10 -> 'intro00', played before entering the first level.
; The ending movie seq_0000 is handled at the data layer (movie ID=0); no code patch needed.
; ============================================================
; ============================================================
[CampaignMovie]
; 是否启用本 Feature
; Whether to enable this feature
Enabled = 1

; VersionStamp - 游戏版本/构建日期信息替换为 CulturesGameExtend
; 主菜单版本行 + 网络日志头（netlog.cpp）的 Build 信息改为
; "CulturesGameExtend v<版本> (Build <DLL 构建日期>)"
; 版本号由 build_deploy.sh 从 git tag 自动注入（每次构建决定）。
; VersionStamp - replace game version/build date info with CulturesGameExtend
; Main-menu version line + netlog.cpp header Build info changed to
; "CulturesGameExtend v<version> (Build <DLL build date>)"
; Version is auto-injected from the git tag by build_deploy.sh (decided per build).
; ============================================================
; ============================================================
[VersionStamp]
; 是否启用本 Feature
; Whether to enable this feature
Enabled = 1

; PerMapLogic - 每张地图独立的游戏平衡（logic 与地图同包分发）
; 进图时（建世界前）把 12 张平衡表（jobtypes/goodtypes/...）按地图包
; 内部的 logic\ 子目录重载（与 data\logic 同布局）：
;   - 官方文件夹图 data\maps\<dir>\     -> <dir>\logic\jobtypes.ini
;   - 用户文件夹图（currentusermap 布局）-> <地图文件夹>\currentusermap\logic\jobtypes.ini
;   - c2m 包                           -> 包内 currentusermap\logic\*.ini
; 某个表缺失 -> 自动回退全局 data\logic；整图无 logic\ -> 完全原版。
; logic 随地图包一起分发/传输（多人整包传图，双方同平衡）。
; ★ 每表独立开关（二分定位 bug 用）：
;   每个 Reload<Name> 控制对应 loader 是否在进图时重载。
;   全部 =1 是完整功能。若怀疑某张表的重载导致 bug（如资源/图标消失），
;   把它单独改为 0 再进图测试。二分法：先关一半看是否恢复，再对半缩小，
;   最快找出罪魁祸首。日志里每行会显示 -> SKIPPED (switch off)。
; PerMapLogic - per-map game balance (logic shipped together with the map)
; On map entry (before world build), reloads the 12 balance tables (jobtypes/goodtypes/...) per the map package
; from the map package's internal logic/ subfolder (same layout as data/logic):
; - Official folder map data/maps/<dir>/     -> <dir>/logic/jobtypes.ini
; - User folder map (currentusermap layout) -> <map folder>/currentusermap/logic/jobtypes.ini
; - c2m package                           -> currentusermap/logic/*.ini inside package
; Missing table -> auto-fallback to global data/logic; map with no logic/ -> fully vanilla.
; logic is distributed/transferred together with the map package (multiplayer sends the whole map, both sides share balance).
; Per-table independent switches (for binary-search bug localization):
; Each Reload<Name> controls whether its loader reloads on map entry.
; All =1 is full functionality. If you suspect a table reload causes a bug (e.g. resources/icons disappear),
; set it to 0 alone and test. Binary search: disable half first to see if it recovers, then halve again,
; to quickly find the culprit. The log shows -> SKIPPED (switch off) per line.
; ============================================================
;
; ============================================================
[PerMapLogic]
; 是否启用本 Feature
; Whether to enable this feature
Enabled = 1
; 每表独立开关（1=重载，0=跳过）
; Per-table switch (1 = reload, 0 = skip)
ReloadLandscapetypes = 1
ReloadTrianglepatterntypes = 1
ReloadGoodtypes = 1
ReloadHousetypes = 1
ReloadVehicletypes = 1
ReloadAtomicanimations = 1
ReloadTribetypes = 1
ReloadJobtypes = 1
ReloadWeapontypes = 1
ReloadArmortypes = 1
ReloadAnimaltypes = 1
ReloadHumanjobexperiencetypes = 1
; 调试日志（每次进图打印逐表来源与开关状态）
; Debug log (prints per-table source and switch state on each map entry)
Debug = 1
