; CulturesGameExtend_CustomSafety.ini
; 自定义安全补丁配置（独立于上游 CulturesPatches，便于未来同步上游）
;
; Custom safety patch config (independent of upstream CulturesPatches, so upstream
;   re-sync stays clean).
;
; 作用：给 Game.exe.sub_493EF2 的两处 div 做除零防护，避免 [PerMapLogic] 全量
;   加载 logic 触发 EXCEPTION_INT_DIVIDE_BY_ZERO (0xC0000094) 崩溃。
;
; 开关联动：本功能“是否生效”绑定 [PerMapLogic] 总开关——只有 [PerMapLogic]
;   Enabled=1（触发崩溃路径）时才应用防护，确保触发与修复严格对齐。
;
; Purpose: byte-guard the two div sites in Game.exe.sub_493EF2 to prevent the
;   EXCEPTION_INT_DIVIDE_BY_ZERO (0xC0000094) crash that [PerMapLogic] loading
;   logic wholesale can trigger.
; Switch binding: this feature's activation is bound to the [PerMapLogic] master
;   switch -- guards are applied only when [PerMapLogic] Enabled=1.
; ============================================================
[CustomSafety]
; 是否启用除零防护（默认 1）。
; 设为 0 可在保留 [PerMapLogic]=1 的情况下关闭防护、复现崩溃用于测试。
; Whether to enable the divide-by-zero guard (default 1).
; Set to 0 to disable the guard while keeping [PerMapLogic]=1, to reproduce the crash for testing.
Enabled = 1

; 纯字节补丁数据目录（相对游戏根目录；独立于上游 patches/）。
; Raw byte-patch data directory (relative to game root; independent of upstream patches/).
PatchDir = plugins/config/custompatches
