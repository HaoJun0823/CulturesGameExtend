; CulturesGameExtend - 非官方补丁配置（单独成文件）
; 本文件包含所有"非官方内容"：补丁注入总开关与纯字节补丁数据配置。
; 与框架自身配置（CulturesGameExtend_Global/Game.ini）分离，
; 便于只保留官方/框架能力时直接停用本文件。
; CulturesGameExtend - unofficial patch config (separate file)
; This file contains all 'unofficial content': the patch injection master switch and raw byte-patch data config.
; Separated from the framework's own config (CulturesGameExtend_Global/Game.ini),
; so you can disable this file directly when only official/framework capabilities are wanted.
; ============================================================
; ============================================================
; https://github.com/Basssiiie/cultures-saga-patches

; CulturesPatches - 补丁注入总开关（单一开关，无子开关）
; 所有 patches/*.ini 由本开关统一控制；社区可直接增删 patches/ 下的文件，无需为每个补丁单独设开关。
; CulturesPatches - patch injection master switch (single switch, no sub-switches)
; All patches/*.ini are controlled by this single switch; the community can add/remove files under patches/ directly, no per-patch switch needed.
; ============================================================
; ============================================================
[CulturesPatches]
; 是否启用补丁注入 Feature
; Whether to enable the patch injection feature
Enabled = 1
; 纯字节补丁数据目录（相对游戏根目录）
; Raw byte-patch data directory (relative to game root)
PatchDir = plugins/config/patches
