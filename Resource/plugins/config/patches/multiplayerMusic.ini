# 在联机中启用 DirectMusic 并停止覆盖用户音乐设置
# 格式: <addr> <hex bytes>   (addr 相对 image base 0x400000)
# JMP 跳过音乐设置覆盖
# Enable DirectMusic in multiplayer and stop overriding the user's music settings
# Format: <addr> <hex bytes>   (addr relative to image base 0x400000)
# JMP to skip the music-settings override
# multiplayerMusic.ini
0xd7ba7 EB 36 | 8B 0D 90 99 56
# JMP 跳过禁用 DirectMusic 按钮检查
# JMP to skip the disable-DirectMusic button check
0x9054c EB 10 | 80 3D
