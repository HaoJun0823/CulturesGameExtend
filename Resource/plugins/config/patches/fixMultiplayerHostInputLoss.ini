# 修复：主机加载游戏后失去输入控制（预初始化 tick=1 以匹配进入的消息）
# 格式: <addr> <hex bytes>   (addr 相对 image base 0x400000)
# Fix: host loses input control after loading the game (pre-init tick=1 to match the entry message)
# Format: <addr> <hex bytes>   (addr relative to image base 0x400000)
# fixMultiplayerHostInputLoss.ini
# MOV dword ptr [ESI+0xC], 1   ; tick = 1
# JBE 0xE09BA                  ; short jump
0xe0978 C7 46 0C 01 00 00 00 76 39 | 89 5E 0C 0F 86 B0 00 00 00
