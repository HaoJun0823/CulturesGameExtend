# 提高房屋上限 400 -> 2000
# 格式: <addr> <hex bytes>   (addr 相对 image base 0x400000)
# Raise house cap 400 -> 2000
# Format: <addr> <hex bytes>   (addr relative to image base 0x400000)
# houseLimits.ini
#
# HouseArray::Constructor()
# MOV EBX, 0x3D8400  (2000 * 0x7E0)
0xaa73 BB 00 84 3D 00 | BB 00 4E 0C 00
# MOV dword ptr [ESP+0x14], 0x7D0  (2000)
0xaa8b C7 44 24 14 D0 07 00 00 | C7 44 24 14 90 01 00 00
# PUSH 0x7D0
0xaad4 68 D0 07 00 00 | 68 90 01 00 00
