; DivZeroGuard.ini — sub_493EF2 两处 div 除零防护
; 格式：<addr 相对基址偏移> <新字节...> | <写入前校验的原字节...>
; addr 为 VA - 0x400000（无 ASLR，基址恒 0x400000）。
;
; DivZeroGuard.ini -- divide-by-zero guards for sub_493EF2
; Format: <addr (offset from image base)> <new bytes...> | <original bytes to verify before write>
; addr = VA - 0x400000 (no ASLR; base is always 0x400000).
;
; 崩溃复盘：Game.exe.46600.dmp，Eip=0x494484 (div [ebp+0x28], 除数 a5=0)，
;   由 [PerMapLogic] 全量加载 logic 触发。以下两处为原版 Game.exe 固有缺陷的通用安全网。
; Crash recap: Game.exe.46600.dmp, Eip=0x494484 (div [ebp+0x28], divisor a5=0),
;   triggered by [PerMapLogic] loading logic wholesale. Both sites below are a
;   generic safety net over a vanilla Game.exe defect.

; Site 1 @ VA 0x494484 (offset 0x94484): div [ebp+0x28] -> xor eax,eax ; nop
;   商置 0（原 div 写 eax=商）；edx(余数) 在后续 mov edx,[esi+4] 被覆盖，无需处理。
;   quotient set to 0 (orig div writes eax=quotient); edx(remainder) is overwritten
;   by the following mov edx,[esi+4], so no need to zero it.
0x94484 33 C0 90 | F7 75 28

; Site 2 @ VA 0x494474 (offset 0x94474): div [esi] ; mov eax,edx -> xor eax,eax ; xor edx,edx
;   商与余数均置 0（原两条指令分别计算商=eax、余数->eax）；之后 jmp 0x49448E 继续正常流程。
;   quotient and remainder both set to 0; execution continues at jmp 0x49448E as normal.
0x94474 33 C0 33 D2 | F7 36 8B C2
