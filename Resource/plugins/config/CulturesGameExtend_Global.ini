; CulturesGameExtend - Global 配置（默认/共享）
; 由 CulturesGameExtend_Game.ini 覆盖同名键（Global 打底、Game 覆盖）
; CulturesGameExtend - Global config (defaults / shared)
; Overridden by same-named keys in CulturesGameExtend_Game.ini (Global as base, Game overrides)
; ============================================================
; ============================================================

[General]
; 日志级别: Trace / Debug / Info / Warn / Error / None
; Log level: Trace / Debug / Info / Warn / Error / None
LogLevel = Info

[Version]
; 主程序 exe 名称（只有这一个程序）
; Main executable name (the only program)
ExeName = Game.exe

; TitleOverride - 游戏主窗口标题替换
; 在窗口创建时 + 每次 WM_SETTEXT 时强制设为下方标题（UTF-8 编码保存，
; 宽字符处理，中文安全）。留空 Title = 表示不启用替换。
; 可用 Game 配置覆盖。
; TitleOverride - replace the game main window title
; Force the title below on window creation + every WM_SETTEXT (saved as UTF-8,
; wide-char handled, Chinese-safe). Leave Title = empty to disable replacement.
; Can be overridden by Game config.
; ============================================================
; ============================================================
[TitleOverride]
; 是否启用本 Feature
; Whether to enable this feature
Enabled = 1
; 新窗口标题（UTF-8）。示例：文化：萨迦 汉化整合版
; New window title (UTF-8). Example: Cultures: Saga Chinese-integrated edition
Title = 文化：萨迦 汉化整合版
