; ============================================================
; 多语言 [TextRenderer] 覆盖模板（语言代码 ini）
;
; 文件名 = <语言代码>.ini，与 plugins/fonts/<语言代码>.ttf 对应：
;   语言代码由 Game.ini 的 set_language 决定：
;     0=ger  1=eng  2=fra  3=ita  4=cze  5=rus
;     6=pol  7=spa  8=por  9=hun  10=l10 ... 19
;   例：l10.ini 覆盖繁中（对应 l10.ttf）；eng.ini 覆盖英文（对应 eng.ttf）
;
; 本文件所有键默认注释（无覆盖效果）。复制需要的键、取消注释并改值即可。
; 生效优先级：plugins/fonts/<code>.ini > plugins/config/CulturesGameExtend_Game.ini
;
; 注意：此文件须随 DLL 一起部署（build_deploy.sh 会把 Resource/plugins/**
;   根对根拷贝到游戏根 plugins/ 与 Release/plugins/）。
; ============================================================

[TextRenderer]
; 是否启用本 Feature（可让某个语言单独关闭渲染）
;Enabled = 1
; 系统字体名覆盖（留空 = 按语言自动选 plugins/fonts/<code>.ttf）
;FontName =
; 字体文件显式覆盖（优先级高于语言驱动）
;FontFile =
; 字号（像素）。不同语言可配不同字号
;FontSize = 14
; 自测开关
;SelfTest = 1
; 自测文本（UTF-8，\n 换行；不同语言写各自的测试文本验证字形）
;SelfTestText = 繁體中文測試 多語言渲染 ABC 123
; 游戏内 hook 开关
;HookEnabled = 1
; 文本色 0xRRGGBB（仅 UseEngineColor=0 时生效）
;TextColor = FFFFFF
; 使用引擎颜色（1=推荐还原原版配色/阴影）
;UseEngineColor = 1
; 分词补丁（1=推荐）
;WordSplitPatch = 1
; 像素幂等混合（1=推荐）
;BlendIdempotent = 1
; 垂直微调（默认 0，内置行高自适应居中）
;TextYOffset = 0
; 水平微调（默认 3）
;TextXOffset = 3
